<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Semantic Project Explorer</title>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --ink: #1d1d1f; --muted: #6b6b70; --line: #e3e3e0;
  --accent: #2463eb; --explicit: #2463eb; --inferred: #8b5cf6; --candidate: #d97706; --unknown: #9ca3af;
  --added: #15803d; --removed: #dc2626; --changed: #d97706; --edge: #8a8a92; --halo: #f59e0b;
  --petal-l: 55%; --petal-a: 0.10; --shadow: 0 1px 3px rgba(0,0,0,.08);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111114; --panel: #1b1b20; --ink: #ececf1; --muted: #a0a0aa; --line: #2c2c34;
    --accent: #6ea0ff; --explicit: #6ea0ff; --inferred: #b197fc; --candidate: #fbbf24; --unknown: #6b7280;
    --added: #4ade80; --removed: #f87171; --changed: #fbbf24; --edge: #7a7a86; --halo: #fbbf24;
    --petal-l: 62%; --petal-a: 0.13; --shadow: 0 1px 3px rgba(0,0,0,.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111114; --panel: #1b1b20; --ink: #ececf1; --muted: #a0a0aa; --line: #2c2c34;
  --accent: #6ea0ff; --explicit: #6ea0ff; --inferred: #b197fc; --candidate: #fbbf24; --unknown: #6b7280;
  --added: #4ade80; --removed: #f87171; --changed: #fbbf24; --edge: #7a7a86; --halo: #fbbf24;
  --petal-l: 62%; --petal-a: 0.13; --shadow: 0 1px 3px rgba(0,0,0,.5);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
header h1 { font-size: 16px; margin: 0; font-weight: 650; }
header .meta { color: var(--muted); font-size: 12px; }
header .spacer { flex: 1; }
button, input[type=search], select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; }
button { cursor: pointer; }
button:hover { border-color: var(--accent); }
input[type=search] { min-width: 0; width: 220px; }
main { display: grid; grid-template-columns: 260px 1fr 340px; height: calc(100% - 53px); min-height: 480px; }
aside { background: var(--panel); border-right: 1px solid var(--line); overflow: auto; padding: 12px 14px; }
aside.right { border-right: 0; border-left: 1px solid var(--line); }
h2 { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 16px 0 6px; font-weight: 600; }
h2:first-child { margin-top: 0; }
.chk { display: flex; align-items: center; gap: 7px; padding: 2px 0; cursor: pointer; user-select: none; }
.chk .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.chk .n { color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; font-size: 12px; }
#stage { position: relative; overflow: hidden; touch-action: none; }
#stage > svg { width: 100%; height: 100%; display: block; cursor: grab; }
#stage > svg.dragging { cursor: grabbing; }
.zoom { position: absolute; right: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 6px; }
.zoom button { width: 34px; height: 34px; padding: 0; background: var(--panel); box-shadow: var(--shadow); }
.legend { position: absolute; left: 12px; bottom: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 12px; box-shadow: var(--shadow); }
.legend div { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.edge { fill: none; stroke: var(--edge); }
.edge.inferred { stroke-dasharray: 6 4; }
.edge.candidate { stroke-dasharray: 2 4; }
.edge.unknown { stroke-dasharray: 1 6; }
.edge.hl { stroke: var(--accent); stroke-width: 2.2; }
.node circle.body { stroke-width: 2; }
.node.noncanonical circle.body { stroke-dasharray: 3 2; }
.node text { font-size: 11px; fill: var(--ink); paint-order: stroke; stroke: var(--bg); stroke-width: 3px; pointer-events: none; }
.node .lbl { display: none; }
.zoomed .node .lbl, .node.big .lbl, .node.sel .lbl, .node.match .lbl, .node:hover .lbl { display: block; }
.node { cursor: pointer; }
.node.sel circle.body { stroke: var(--accent) !important; stroke-width: 3.5; stroke-dasharray: none; }
.dim { opacity: .12; }
.halo { fill: none; stroke: var(--halo); stroke-width: 2; opacity: .8; }
.badge { fill: var(--candidate); stroke: var(--panel); stroke-width: 1.5; }
.petal-label { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; opacity: .75; pointer-events: none; }
dl { margin: 0; display: grid; grid-template-columns: 96px 1fr; gap: 4px 10px; }
dt { color: var(--muted); }
dd { margin: 0; word-break: break-word; }
.pill { display: inline-block; padding: 0 7px; border-radius: 99px; font-size: 11px; font-weight: 600; border: 1px solid currentColor; }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 4px; }
.bar i { display: block; height: 100%; background: var(--accent); }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 4px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; }
ul.plain li:last-child { border-bottom: 0; }
a.ref { color: var(--accent); cursor: pointer; text-decoration: none; }
a.ref:hover { text-decoration: underline; }
code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; }
.muted { color: var(--muted); }
.empty { padding: 40px 24px; text-align: center; color: var(--muted); }
.tabs { display: flex; gap: 6px; margin-bottom: 10px; }
.tabs button.on { border-color: var(--accent); color: var(--accent); }
@media (max-width: 1100px) { main { grid-template-columns: 220px 1fr; } aside.right { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--line); max-height: 45vh; } }
@media (max-width: 720px) {
  main { display: flex; flex-direction: column; height: auto; }
  #stage { height: 70vh; order: 1; }
  aside.left { order: 2; border-right: 0; border-top: 1px solid var(--line); }
  aside.right { order: 3; max-height: none; }
  input[type=search] { width: 100%; }
  header .spacer { display: none; }
}
</style>
</head>
<body>
<header>
  <h1 id="title">Semantic Project Explorer</h1>
  <span class="meta" id="meta"></span>
  <span class="spacer"></span>
  <input type="search" id="search" placeholder="Search entities…" aria-label="Search entities">
  <label><button type="button" id="load">Load JSON…</button><input type="file" id="file" accept=".json,application/json" hidden></label>
  <button type="button" id="theme" title="Toggle theme">Theme</button>
</header>
<main>
  <aside class="left">
    <h2>Status</h2><div id="f-status"></div>
    <h2>Entities (clusters)</h2><div id="f-cluster"></div>
    <h2>Relationships</h2><div id="f-relation"></div>
  </aside>
  <section id="stage">
    <svg id="svg" role="img" aria-label="Radial semantic graph"><g id="viewport"><g id="petals"></g><g id="edges"></g><g id="nodes"></g></g></svg>
    <div class="legend">
      <div><svg width="26" height="10"><line x1="0" y1="5" x2="26" y2="5" class="edge" stroke-width="2"/></svg> canonical / explicit</div>
      <div><svg width="26" height="10"><line x1="0" y1="5" x2="26" y2="5" class="edge inferred" stroke-width="2"/></svg> inferred</div>
      <div><svg width="26" height="10"><line x1="0" y1="5" x2="26" y2="5" class="edge candidate" stroke-width="2"/></svg> candidate</div>
      <div><svg width="26" height="12"><circle cx="13" cy="6" r="5" class="halo"/></svg> changed in last diff</div>
      <div><svg width="26" height="12"><circle cx="13" cy="6" r="4" class="badge"/></svg> pending proposal</div>
    </div>
    <div class="zoom"><button type="button" id="zin" aria-label="Zoom in">+</button><button type="button" id="zout" aria-label="Zoom out">−</button><button type="button" id="zreset" aria-label="Reset view">⟲</button></div>
  </section>
  <aside class="right">
    <div class="tabs"><button type="button" id="tab-details" class="on">Details</button><button type="button" id="tab-diff">Semantic diff</button></div>
    <div id="details"><div class="empty">Select a node to see its type, role, confidence, status, sources, relationships and provenance.</div></div>
    <div id="diff" hidden></div>
  </aside>
</main>
<script id="graph-data" type="application/json">/*__NEXUS_GRAPH__*/null</script>
<script>
(function () {
  "use strict";
  var ORDER = ["skills", "policies", "tests", "behaviors", "contracts", "design", "features", "domains", "apis", "code", "docs", "history", "files", "other"];
  var HUES = { skills: 210, policies: 0, tests: 150, behaviors: 280, contracts: 320, design: 25, features: 190, domains: 95, apis: 45, code: 235, docs: 170, history: 60, files: 0, other: 0, core: 0 };
  var SAT = { files: 0, other: 0, core: 0 };
  var STATUSES = ["explicit", "inferred", "candidate", "unknown"];
  var svg = document.getElementById("svg"), vp = document.getElementById("viewport");
  var gPetals = document.getElementById("petals"), gEdges = document.getElementById("edges"), gNodes = document.getElementById("nodes");
  var NS = "http://www.w3.org/2000/svg";
  var graph = null, byId = {}, pos = {}, selected = null;
  var filters = { status: {}, cluster: {}, relation: {}, canonicalOnly: false };
  var view = { x: 0, y: 0, k: 1 };

  function el(tag, attrs, parent) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function h(tag, text, cls) { var e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; }
  function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
  function clusterColor(c, alpha) {
    var s = SAT[c] === 0 ? 0 : 62;
    return "hsla(" + (HUES[c] || 0) + "," + s + "%," + css("--petal-l") + "," + (alpha == null ? 1 : alpha) + ")";
  }
  function statusColor(s) { return css("--" + (STATUSES.indexOf(s) >= 0 ? s : "unknown")); }
  function store(key, value) { try { if (value === undefined) return localStorage.getItem(key); localStorage.setItem(key, value); } catch (e) { return null; } }

  // ---- data -------------------------------------------------------------
  function load(data) {
    if (!data || !data.nodes) { showEmpty(); return; }
    graph = data; byId = {};
    data.nodes.forEach(function (n) { byId[n.id] = n; n._in = []; n._out = []; });
    data.edges.forEach(function (e) { if (byId[e.from]) byId[e.from]._out.push(e); if (byId[e.to]) byId[e.to]._in.push(e); });
    document.getElementById("title").textContent = (data.projectName || data.projectId) + " — semantic graph";
    var when = data.generatedAt ? new Date(data.generatedAt * 1000).toISOString().slice(0, 16).replace("T", " ") : "";
    document.getElementById("meta").textContent = data.nodes.length + " nodes · " + data.edges.length + " edges · model confidence " + (data.modelConfidence ? data.modelConfidence.value : "?") + (when ? " · " + when + " UTC" : "");
    buildFilters(); layout(); render(); renderDiff(); resetView();
  }
  function showEmpty() {
    document.getElementById("details").innerHTML = "";
    var d = h("div", "No graph embedded. Use “Load JSON…” to open a semantic-graph.json exported by agent-nexus.", "empty");
    document.getElementById("details").appendChild(d);
  }

  // ---- filters ----------------------------------------------------------
  function checkbox(container, key, group, label, count, color) {
    var row = h("label", null, "chk");
    var input = document.createElement("input"); input.type = "checkbox"; input.checked = filters[group][key] !== false;
    input.addEventListener("change", function () { filters[group][key] = input.checked; applyVisibility(); });
    row.appendChild(input);
    if (color) { var sw = h("span", null, "sw"); sw.style.background = color; row.appendChild(sw); }
    row.appendChild(h("span", label));
    row.appendChild(h("span", String(count), "n"));
    container.appendChild(row);
  }
  function buildFilters() {
    var fs = document.getElementById("f-status"), fc = document.getElementById("f-cluster"), fr = document.getElementById("f-relation");
    fs.innerHTML = fc.innerHTML = fr.innerHTML = "";
    var sc = {}; graph.nodes.forEach(function (n) { sc[n.status] = (sc[n.status] || 0) + 1; });
    STATUSES.forEach(function (s) { if (sc[s]) checkbox(fs, s, "status", s, sc[s], statusColor(s)); });
    var canon = h("label", null, "chk"), ci = document.createElement("input"); ci.type = "checkbox";
    ci.addEventListener("change", function () { filters.canonicalOnly = ci.checked; applyVisibility(); });
    canon.appendChild(ci); canon.appendChild(h("span", "canonical only"));
    canon.appendChild(h("span", String(graph.nodes.filter(function (n) { return n.canonical; }).length), "n"));
    fs.appendChild(canon);
    graph.clusters.forEach(function (c) { if (c.id !== "core") checkbox(fc, c.id, "cluster", c.id, c.count, clusterColor(c.id)); });
    var rc = {}; graph.edges.forEach(function (e) { rc[e.relation] = (rc[e.relation] || 0) + 1; });
    Object.keys(rc).sort().forEach(function (r) { checkbox(fr, r, "relation", r, rc[r]); });
  }
  function nodeVisible(n) {
    if (n.id === graph.root) return true;
    if (filters.status[n.status] === false) return false;
    if (filters.cluster[n.cluster] === false) return false;
    if (filters.canonicalOnly && !n.canonical) return false;
    return true;
  }
  function edgeVisible(e) {
    return filters.relation[e.relation] !== false && byId[e.from] && byId[e.to] && nodeVisible(byId[e.from]) && nodeVisible(byId[e.to]) && !(filters.canonicalOnly && !e.canonical) && filters.status[e.status] !== false;
  }

  // ---- radial layout ----------------------------------------------------
  var petals = [];
  function layout() {
    pos = {}; petals = [];
    var root = byId[graph.root]; if (root) pos[root.id] = { x: 0, y: 0 };
    var groups = {};
    graph.nodes.forEach(function (n) { if (n.id !== graph.root) (groups[n.cluster] = groups[n.cluster] || []).push(n); });
    var names = Object.keys(groups).sort(function (a, b) { return (ORDER.indexOf(a) + 99) % 99 - (ORDER.indexOf(b) + 99) % 99 || a.localeCompare(b); });
    var weights = names.map(function (c) { return Math.max(1.2, Math.sqrt(groups[c].length)); });
    var total = weights.reduce(function (a, b) { return a + b; }, 0) || 1;
    var gap = names.length > 1 ? 0.06 : 0, avail = Math.PI * 2 - gap * names.length, a = -Math.PI / 2;
    var R0 = 120, RING = 95;
    names.forEach(function (c, i) {
      var span = avail * weights[i] / total, a0 = a + gap / 2, a1 = a0 + span; a = a1 + gap / 2;
      var byDepth = {};
      groups[c].forEach(function (n) { (byDepth[n.depth] = byDepth[n.depth] || []).push(n); });
      var depths = Object.keys(byDepth).map(Number).sort(function (x, y) { return x - y; });
      var ring = 0, rMax = R0;
      depths.forEach(function (d) {
        var list = byDepth[d].sort(function (x, y) { return y.centrality - x.centrality || x.id.localeCompare(y.id); });
        var r = R0 + ring * RING, perRow = Math.max(1, Math.floor(span * r / 38));
        for (var j = 0; j < list.length; j += perRow) {
          var row = list.slice(j, j + perRow), rr = R0 + ring * RING;
          row.forEach(function (n, k) {
            var t = row.length === 1 ? 0.5 : (k + 0.5) / row.length;
            var ang = a0 + span * (0.08 + 0.84 * t);
            pos[n.id] = { x: Math.cos(ang) * rr, y: Math.sin(ang) * rr };
          });
          rMax = Math.max(rMax, rr); ring++;
          perRow = Math.max(1, Math.floor(span * (R0 + ring * RING) / 38));
        }
      });
      petals.push({ cluster: c, a0: a0, a1: a1, r: rMax + 60 });
    });
  }
  function polar(r, a) { return (Math.cos(a) * r).toFixed(1) + "," + (Math.sin(a) * r).toFixed(1); }

  // ---- render -----------------------------------------------------------
  function render() {
    gPetals.innerHTML = gEdges.innerHTML = gNodes.innerHTML = "";
    petals.forEach(function (p) {
      var mid = (p.a0 + p.a1) / 2, bulge = Math.min(0.35, (p.a1 - p.a0) * 0.25);
      var d = "M0,0 C" + polar(p.r * 0.45, p.a0 - bulge) + " " + polar(p.r * 0.95, p.a0 - bulge * 0.4) + " " + polar(p.r, mid) +
        " C" + polar(p.r * 0.95, p.a1 + bulge * 0.4) + " " + polar(p.r * 0.45, p.a1 + bulge) + " 0,0 Z";
      el("path", { d: d, fill: clusterColor(p.cluster, css("--petal-a")), stroke: clusterColor(p.cluster, 0.35), "stroke-width": 1, "data-cluster": p.cluster }, gPetals);
      var t = el("text", { x: Math.cos(mid) * (p.r + 30), y: Math.sin(mid) * (p.r + 30), "text-anchor": "middle", "dominant-baseline": "middle", class: "petal-label", fill: clusterColor(p.cluster), "data-cluster": p.cluster }, gPetals);
      t.textContent = p.cluster;
    });
    graph.edges.forEach(function (e) {
      var s = pos[e.from], t = pos[e.to]; if (!s || !t) return;
      var cx = (s.x + t.x) * 0.3, cy = (s.y + t.y) * 0.3;
      var path = el("path", { d: "M" + s.x.toFixed(1) + "," + s.y.toFixed(1) + " Q" + cx.toFixed(1) + "," + cy.toFixed(1) + " " + t.x.toFixed(1) + "," + t.y.toFixed(1), class: "edge " + e.status, "stroke-width": (0.6 + e.confidence * 1.1).toFixed(2), "stroke-opacity": (0.25 + e.confidence * 0.5).toFixed(2) }, gEdges);
      path._edge = e; e._el = path;
      var title = el("title", {}, path); title.textContent = e.from + " —" + e.relation + "→ " + e.to + " (" + e.status + (e.canonical ? ", canonical" : "") + ", " + e.confidence + ")";
    });
    var changed = {};
    (graph.diff || []).forEach(function (c) { if (c.entity) changed[c.entity] = true; if (c.category === "Entity") changed[c.id] = true; });
    graph.nodes.forEach(function (n) {
      var p = pos[n.id]; if (!p) return;
      var root = n.id === graph.root, r = root ? 22 : Math.min(18, 5 + n.centrality * 40);
      var g = el("g", { class: "node" + (n.canonical ? "" : " noncanonical") + (root || n.depth <= 1 || r > 9 ? " big" : ""), transform: "translate(" + p.x.toFixed(1) + "," + p.y.toFixed(1) + ")", tabindex: 0, role: "button", "aria-label": n.label }, gNodes);
      if (changed[n.id]) el("circle", { r: r + 5, class: "halo" }, g);
      el("circle", { r: r, class: "body", fill: root ? css("--accent") : clusterColor(n.cluster, 0.35 + 0.65 * n.confidence), stroke: statusColor(n.status) }, g);
      if (n.pendingProposals && n.pendingProposals.length) el("circle", { r: 4, cx: r * 0.75, cy: -r * 0.75, class: "badge" }, g);
      var lbl = el("text", { class: "lbl", x: r + 4, y: 4 }, g); lbl.textContent = n.label.length > 36 ? n.label.slice(0, 35) + "…" : n.label;
      g._node = n; n._el = g;
      g.addEventListener("click", function (ev) { ev.stopPropagation(); select(n.id); });
      g.addEventListener("keydown", function (ev) { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); select(n.id); } });
    });
    applyVisibility();
  }
  function applyVisibility() {
    if (!graph) return;
    var q = document.getElementById("search").value.trim().toLowerCase(), any = false;
    graph.nodes.forEach(function (n) {
      if (!n._el) return;
      var vis = nodeVisible(n), match = q && (n.label.toLowerCase().indexOf(q) >= 0 || n.id.toLowerCase().indexOf(q) >= 0 || n.kind.toLowerCase().indexOf(q) >= 0);
      if (match) any = true;
      n._el.style.display = vis ? "" : "none";
      n._el.classList.toggle("match", !!match);
      n._match = match;
    });
    var focus = selected ? neighbours(selected) : null;
    graph.nodes.forEach(function (n) {
      if (!n._el) return;
      var dim = (q && any && !n._match) || (focus && !focus[n.id]);
      n._el.classList.toggle("dim", !!dim);
    });
    graph.edges.forEach(function (e) {
      if (!e._el) return;
      e._el.style.display = edgeVisible(e) ? "" : "none";
      var hl = selected && (e.from === selected || e.to === selected);
      e._el.classList.toggle("hl", !!hl);
      e._el.classList.toggle("dim", !!((selected && !hl) || (q && any && !(byId[e.from]._match || byId[e.to]._match))));
    });
    gPetals.querySelectorAll("[data-cluster]").forEach(function (p) { p.style.display = filters.cluster[p.getAttribute("data-cluster")] === false ? "none" : ""; });
  }
  function neighbours(id) {
    var set = {}; set[id] = true;
    graph.edges.forEach(function (e) { if (e.from === id) set[e.to] = true; if (e.to === id) set[e.from] = true; });
    return set;
  }

  // ---- details ----------------------------------------------------------
  function ref(id) {
    var a = h("a", byId[id] ? byId[id].label : id, "ref"); a.title = id;
    a.addEventListener("click", function () { select(id, true); });
    return a;
  }
  function provList(list) {
    var ul = h("ul", null, "plain");
    (list || []).forEach(function (p) {
      var li = h("li"); var src = h("code", p.source + (p.lineStart ? ":" + p.lineStart + (p.lineEnd && p.lineEnd !== p.lineStart ? "-" + p.lineEnd : "") : ""));
      li.appendChild(src);
      var extra = [p.extraction]; if (p.commit) extra.push("commit " + p.commit.slice(0, 7)); if (p.artifact) extra.push(p.artifact);
      li.appendChild(h("div", extra.join(" · "), "muted"));
      ul.appendChild(li);
    });
    if (!ul.children.length) ul.appendChild(h("li", "none recorded", "muted"));
    return ul;
  }
  function select(id, center) {
    selected = byId[id] ? id : null;
    graph.nodes.forEach(function (n) { if (n._el) n._el.classList.toggle("sel", n.id === selected); });
    applyVisibility(); showTab("details");
    var box = document.getElementById("details"); box.innerHTML = "";
    if (!selected) { box.appendChild(h("div", "Select a node.", "empty")); return; }
    var n = byId[selected];
    if (center && pos[n.id]) { var r = svg.getBoundingClientRect(); view.x = r.width / 2 - pos[n.id].x * view.k; view.y = r.height / 2 - pos[n.id].y * view.k; applyView(); }
    box.appendChild(h("h2", "Entity"));
    var title = h("div", n.label); title.style.fontSize = "16px"; title.style.fontWeight = "650"; box.appendChild(title);
    box.appendChild(h("code", n.id));
    var dl = h("dl"); dl.style.marginTop = "10px";
    function row(k, v) { dl.appendChild(h("dt", k)); var dd = h("dd"); if (v instanceof Node) dd.appendChild(v); else dd.textContent = v == null || v === "" ? "—" : v; dl.appendChild(dd); }
    row("Type", n.kind); row("Role", n.role); row("Cluster", n.cluster);
    var st = h("span", n.status, "pill"); st.style.color = statusColor(n.status); row("Status", st);
    row("Canonical", n.canonical ? "yes (graph or authored source)" : "no (not reviewed)");
    var conf = h("div"); conf.appendChild(h("span", String(n.confidence))); var bar = h("div", null, "bar"), fill = h("i"); fill.style.width = Math.round(n.confidence * 100) + "%"; bar.appendChild(fill); conf.appendChild(bar); row("Confidence", conf);
    row("Description", n.description);
    row("Source", n.provenance && n.provenance[0] ? n.provenance[0].source : "");
    row("Depth", n.depth + " (parent " + (n.parent || "—") + ")"); row("Centrality", String(n.centrality));
    if (n.pendingProposals && n.pendingProposals.length) row("Proposals", n.pendingProposals.join(", ") + " (pending)");
    box.appendChild(dl);
    Object.keys(n.facets || {}).forEach(function (k) {
      box.appendChild(h("h2", k)); var ul = h("ul", null, "plain");
      n.facets[k].forEach(function (t) { ul.appendChild(h("li", t)); }); box.appendChild(ul);
    });
    box.appendChild(h("h2", "Relationships (" + (n._out.length + n._in.length) + ")"));
    var rl = h("ul", null, "plain");
    n._out.forEach(function (e) { var li = h("li"); li.appendChild(h("span", e.relation + " → ", "muted")); li.appendChild(ref(e.to)); li.appendChild(h("span", " · " + e.status + (e.canonical ? "" : ", not canonical"), "muted")); rl.appendChild(li); });
    n._in.forEach(function (e) { var li = h("li"); li.appendChild(ref(e.from)); li.appendChild(h("span", " → " + e.relation + " · " + e.status, "muted")); rl.appendChild(li); });
    if (!rl.children.length) rl.appendChild(h("li", "none", "muted"));
    box.appendChild(rl);
    box.appendChild(h("h2", "Provenance")); box.appendChild(provList(n.provenance));
  }

  // ---- diff -------------------------------------------------------------
  function renderDiff() {
    var box = document.getElementById("diff"); box.innerHTML = "";
    var list = graph.diff || [];
    box.appendChild(h("h2", "Semantic changes (" + list.length + ")"));
    if (!list.length) { box.appendChild(h("div", "No semantic changes recorded by the last ingestion.", "empty")); return; }
    var ul = h("ul", null, "plain");
    list.forEach(function (c) {
      var li = h("li"), kind = /Added$/.test(c.type) ? "added" : /Removed$/.test(c.type) ? "removed" : "changed";
      var pill = h("span", c.type, "pill"); pill.style.color = css("--" + kind); li.appendChild(pill);
      li.appendChild(h("div", c.id)); li.lastChild.style.marginTop = "3px";
      var target = c.entity && byId[c.entity] ? c.entity : (byId[c.id] ? c.id : null);
      if (target) { var d = h("div", null, "muted"); d.appendChild(h("span", "on ")); d.appendChild(ref(target)); li.appendChild(d); }
      if (/Changed$/.test(c.type) && c.change) {
        var pre = h("code", JSON.stringify(c.change)); pre.style.display = "block"; pre.style.whiteSpace = "pre-wrap"; pre.style.marginTop = "3px"; li.appendChild(pre);
      }
      ul.appendChild(li);
    });
    box.appendChild(ul);
  }
  function showTab(name) {
    document.getElementById("details").hidden = name !== "details";
    document.getElementById("diff").hidden = name !== "diff";
    document.getElementById("tab-details").classList.toggle("on", name === "details");
    document.getElementById("tab-diff").classList.toggle("on", name === "diff");
  }

  // ---- pan & zoom -------------------------------------------------------
  function applyView() {
    vp.setAttribute("transform", "translate(" + view.x.toFixed(1) + "," + view.y.toFixed(1) + ") scale(" + view.k.toFixed(3) + ")");
    svg.classList.toggle("zoomed", view.k > 1.5);
  }
  function resetView() {
    var r = svg.getBoundingClientRect(), maxR = 200;
    Object.keys(pos).forEach(function (id) { var p = pos[id]; maxR = Math.max(maxR, Math.hypot(p.x, p.y)); });
    petals.forEach(function (p) { maxR = Math.max(maxR, p.r + 30); });
    view.k = Math.max(0.15, Math.min(r.width, r.height) / (2 * maxR + 40));
    view.x = r.width / 2; view.y = r.height / 2; applyView();
  }
  function zoomAt(factor, cx, cy) {
    var k = Math.max(0.1, Math.min(8, view.k * factor)); factor = k / view.k;
    view.x = cx - (cx - view.x) * factor; view.y = cy - (cy - view.y) * factor; view.k = k; applyView();
  }
  svg.addEventListener("wheel", function (ev) {
    ev.preventDefault(); var r = svg.getBoundingClientRect();
    zoomAt(Math.exp(-ev.deltaY * 0.0015), ev.clientX - r.left, ev.clientY - r.top);
  }, { passive: false });
  var drag = null, pointers = {};
  svg.addEventListener("pointerdown", function (ev) {
    pointers[ev.pointerId] = { x: ev.clientX, y: ev.clientY };
    if (ev.target.closest && ev.target.closest(".node")) return;
    drag = { x: ev.clientX, y: ev.clientY, vx: view.x, vy: view.y, moved: false };
    svg.setPointerCapture(ev.pointerId); svg.classList.add("dragging");
  });
  svg.addEventListener("pointermove", function (ev) {
    var ids = Object.keys(pointers);
    if (ids.length === 2 && pointers[ev.pointerId]) {
      var other = pointers[ids[0] == ev.pointerId ? ids[1] : ids[0]], prev = pointers[ev.pointerId];
      var before = Math.hypot(prev.x - other.x, prev.y - other.y), after = Math.hypot(ev.clientX - other.x, ev.clientY - other.y);
      var r = svg.getBoundingClientRect();
      if (before > 0) zoomAt(after / before, (ev.clientX + other.x) / 2 - r.left, (ev.clientY + other.y) / 2 - r.top);
      pointers[ev.pointerId] = { x: ev.clientX, y: ev.clientY }; drag = null; return;
    }
    if (pointers[ev.pointerId]) pointers[ev.pointerId] = { x: ev.clientX, y: ev.clientY };
    if (!drag) return;
    var dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
    view.x = drag.vx + dx; view.y = drag.vy + dy; applyView();
  });
  function endDrag(ev) {
    delete pointers[ev.pointerId];
    if (drag && !drag.moved && ev.type === "pointerup") select(null);
    drag = null; svg.classList.remove("dragging");
  }
  svg.addEventListener("pointerup", endDrag);
  svg.addEventListener("pointercancel", endDrag);
  document.getElementById("zin").onclick = function () { var r = svg.getBoundingClientRect(); zoomAt(1.3, r.width / 2, r.height / 2); };
  document.getElementById("zout").onclick = function () { var r = svg.getBoundingClientRect(); zoomAt(1 / 1.3, r.width / 2, r.height / 2); };
  document.getElementById("zreset").onclick = resetView;

  // ---- chrome -----------------------------------------------------------
  document.getElementById("search").addEventListener("input", applyVisibility);
  document.getElementById("search").addEventListener("keydown", function (ev) {
    if (ev.key !== "Enter" || !graph) return;
    var hit = graph.nodes.filter(function (n) { return n._match && nodeVisible(n); })[0];
    if (hit) select(hit.id, true);
  });
  document.getElementById("tab-details").onclick = function () { showTab("details"); };
  document.getElementById("tab-diff").onclick = function () { showTab("diff"); };
  document.getElementById("load").onclick = function () { document.getElementById("file").click(); };
  document.getElementById("file").addEventListener("change", function (ev) {
    var f = ev.target.files[0]; if (!f) return;
    var reader = new FileReader();
    reader.onload = function () { try { load(JSON.parse(reader.result)); } catch (e) { alert("Not a semantic-graph.json: " + e.message); } };
    reader.readAsText(f);
  });
  var themeBtn = document.getElementById("theme");
  function setTheme(t) { if (t) document.documentElement.setAttribute("data-theme", t); else document.documentElement.removeAttribute("data-theme"); store("nexus-theme", t || ""); if (graph) { render(); if (selected) select(selected); } }
  themeBtn.onclick = function () {
    var cur = document.documentElement.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    setTheme(cur === "dark" ? "light" : "dark");
  };
  var saved = store("nexus-theme"); if (saved) document.documentElement.setAttribute("data-theme", saved);
  window.addEventListener("resize", function () { if (graph) resetView(); });

  var embedded = null;
  try { embedded = JSON.parse(document.getElementById("graph-data").textContent); } catch (e) { embedded = null; }
  if (embedded) load(embedded); else showEmpty();
  if (graph && location.hash.length > 1) select(decodeURIComponent(location.hash.slice(1)), true);
})();
</script>
</body>
</html>
