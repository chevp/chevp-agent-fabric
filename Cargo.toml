[workspace]
resolver = "2"
members = [
    "crates/nexus-domain",
    "crates/nexus-tools",
    "crates/nexus-tool-graph-insights",
    "crates/nexus-tool-game-studio",
    "crates/nexus-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
