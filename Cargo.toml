[workspace]
resolver = "2"
members = [
    "crates/nexus-domain",
    "crates/nexus-tools",
    "crates/nexus-semantic",
    "crates/nexus-tool-graph-insights",
    "crates/nexus-tool-game-studio",
    "crates/nexus-tool-indexer",
    "crates/nexus-tool-subserver",
    "crates/nexus-server",
    "tooling/asset-factory-mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
async-trait = "0.1"
sha2 = "0.10"
